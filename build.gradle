plugins {
    id 'java'
}

def runeLiteVersion = 'latest.release'

allprojects {
    repositories {
        mavenLocal()
        maven { url = 'https://repo.runelite.net' }
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    group = 'com.constdecimalserrno'
    // Each plugin sets its own version in its build.gradle.

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(11)
        }
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    dependencies {
        compileOnly "net.runelite:client:${runeLiteVersion}"

        testImplementation "net.runelite:client:${runeLiteVersion}"
        testImplementation 'junit:junit:4.13.2'
        testImplementation 'org.mockito:mockito-core:5.12.0'
    }

    tasks.named('test') {
        // Some subprojects only have launcher mains, not JUnit tests
        failOnNoDiscoveredTests = false
    }
}

// Root project — unified launcher that loads all plugins
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

dependencies {
    implementation project(':consts-afk')
    implementation project(':consts-destination')
    implementation project(':consts-leaderboard')
    implementation project(':consts-world')
    implementation project(':consts-models')

    testImplementation "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:jshell:${runeLiteVersion}"
}

tasks.named('test') {
    // Root project only has the launcher, no JUnit tests
    failOnNoDiscoveredTests = false
}

def runeliteJavaHome = System.getenv('RUNELITE_JAVA_HOME') ?: System.getenv('JAVA_HOME')

tasks.register('runClient', JavaExec) {
    group = 'runelite'
    description = 'Launch RuneLite with all plugins loaded'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.osrs.PluginLauncher'
    jvmArgs '-ea'
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs '--add-exports=java.desktop/com.apple.eawt=ALL-UNNAMED'
    }
    if (file("${runeliteJavaHome}/bin/java").exists()) {
        executable = "${runeliteJavaHome}/bin/java"
    }
}

// The play kit, for a machine that plays without building: one jar that starts RuneLite with every plugin, as
// runClient does, and play.sh, which starts it on Java 11. The jar is made like RuneLite's example-plugin shadowJar.
// It holds the RuneLite of the day it's built, so build it again after a RuneLite update, with --refresh-dependencies.
def playKitJar = tasks.register('playKitJar', Jar) {
    group = 'runelite'
    description = 'One jar that starts RuneLite with every plugin'
    dependsOn configurations.testRuntimeClasspath
    manifest {
        attributes('Main-Class': 'com.osrs.PluginLauncher', 'Multi-Release': true)
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from sourceSets.test.output
    from {
        configurations.testRuntimeClasspath.collect { file -> file.isDirectory() ? file : zipTree(file) }
    }
    exclude 'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', '**/module-info.class'
    archiveFileName = 'consts-osrs.jar'
}

tasks.register('playKit', Sync) {
    group = 'runelite'
    description = 'The play kit in build/play-kit: consts-osrs.jar, and play.sh to start it on Java 11'
    from playKitJar
    from('scripts/play.sh') {
        filePermissions {
            unix('rwxr-xr-x')
        }
    }
    into layout.buildDirectory.dir('play-kit')
}
